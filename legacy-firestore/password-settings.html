<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Password — Digital No-Due</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="main-content"><div class="card"><a href="login.html" id="backLink">Back to dashboard</a><h1>Change password</h1><p>Confirm your current password to securely update your account.</p><form id="passwordForm"><label>Current password<input id="currentPassword" type="password" autocomplete="current-password" required></label><label>New password<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirm new password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label><button class="btn-primary" type="submit">Change password</button></form><p id="passwordStatus" role="status" aria-live="polite"></p></div></main><script type="module" src="js/password-settings.js"></script></body></html>
