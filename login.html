<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Digital No-Due — Login</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="manifest" href="manifest.json" />
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="logo">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#1e3a5f" stroke-width="1.6"><path d="M12 3 4 6.5V11c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6.5L12 3Z"/><path d="M9 12l2 2 4-4"/></svg>
      </div>
      <h1>Digital No-Due</h1>
      <p class="sub">Approval &amp; hall ticket verification system</p>

      <form id="loginForm">
        <label for="email">USN / Employee ID (email)</label>
        <input id="email" type="email" placeholder="you@college.edu" required autocomplete="username" />

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password" />

        <p id="loginError" class="hidden" style="color:#c53030; font-size:13px; margin:-4px 0 12px;"></p>

        <button type="submit" class="btn-primary btn-block">Log in</button>
      </form>

      <p class="helper"><a href="#" onclick="alert('Ask your admin to reset it from the Firebase console for now.'); return false;">Forgot password?</a></p>
    </div>
    <p class="helper" style="position:fixed; bottom:16px; width:100%; left:0;">Secure access for authorized institutional personnel only</p>
  </div>

  <script type="module">
    import { wireLoginForm } from "./js/auth.js";
    wireLoginForm();
  </script>
</body>
</html>
